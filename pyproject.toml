[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aida-mate"
version = "0.1.0"
description = "AI-powered Pull Request Risk Analysis Agent, triggered from Linear."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "tenacity>=9.0",
    # Parses the merge-confirmation dialog's form POST (app/api/merge_confirmation.py) —
    # FastAPI's `Form(...)` requires it at runtime.
    "python-multipart>=0.0.12",
    # RS256 signing for GitHub App JWTs. Not needed when using a dev token,
    # but the App is the production path so it ships by default.
    "pyjwt[crypto]>=2.9",
    # `zoneinfo`'s IANA timezone database — stdlib on Linux/macOS, but Windows
    # has no system tz database for it to fall back to. Needed whenever a
    # ScheduledPrompt (CLAUDE.md §1d) uses a named timezone, which is the
    # whole point of that feature.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
# Model providers — install only the one selected via MODEL_PROVIDER.
# openai-agents floor is 0.2.7, not just "some 0.x": that's the first release
# containing ModelSettings.verbosity (openai/openai-agents-python#1439,
# merged 2025-08-13, first shipped in v0.2.7 on 2025-08-14 — verified against
# the real release notes, not assumed) — review_agent.py and prompt_runner.py
# both construct ModelSettings(verbosity=...) unconditionally when a
# reasoning-effort model is configured, which raises TypeError on any older
# release. A bare ">=0.1" floor would let `pip install` resolve to a version
# that predates the field entirely.
openai = ["openai-agents>=0.2.7"]
anthropic = ["anthropic>=0.40"]

dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "respx>=0.21",
    "ruff>=0.7",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    # starlette's TestClient currently warns about httpx; not actionable here.
    "ignore::DeprecationWarning:starlette.*",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
